# Configuracion dinamica de Traefik (provider de archivo). AUD-01, CENS-S1.
# Las opciones "default" aplican a todos los routers con TLS de todos los
# silos: TLS 1.2 como minimo y solo suites con secreto hacia adelante
# (en TLS 1.3 Go fija las suites y esta lista no aplica).
tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
